<div class="cards">
{% for p in pages %}
  <a class="card" href="{{ p.url }}"{% if p.date %} data-date="{{ p.date.isoformat() }}"{% endif %}>
    <div class="card-media">
      {% if p["image"] %}<img src="{{ p['image'] }}" alt="" loading="lazy">{% endif %}
      <h3>{{ p["title"] }}</h3>
    </div>
    <div class="card-body">
      <div class="card-meta"><span class="cat">{{ label or p["category"] }}</span><span>{{ fmt_date(p.date) }}</span></div>
      <p>{{ p["intro"] }} {{ p["summary"] }}</p>
    </div>
  </a>
{% endfor %}
</div>
